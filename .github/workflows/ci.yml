name: Validate macOS plugin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require real browser fixture
        run: test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
      - run: npm run check
      - run: git diff --exit-code -- lib
      - run: npm pack --dry-run
